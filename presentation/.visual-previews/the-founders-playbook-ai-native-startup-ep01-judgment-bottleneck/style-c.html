<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Style C - Warm Cognitive Field</title>
  <link rel="stylesheet" href="preview.css" />
</head>
<body class="variant-c">
  <main class="phone" aria-label="Warm cognitive field style preview">
    <section class="stage">
      <div class="topline">
        <div class="badge">EP01 / AI 创业</div>
        <div class="source">Founder decision field</div>
      </div>

      <header class="headline">
        <div class="kicker">NEW RISK</div>
        <h1>做得很快，但方向错了</h1>
        <div class="subclaim">AI 把执行推快，也把判断推到更前面。</div>
      </header>

      <section class="artifact" aria-label="wrong direction speed path visual">
        <div class="warm-map">
          <div class="lane-stack" aria-label="execution lanes">
            <span class="pill">调研</span>
            <span class="pill">代码</span>
            <span class="pill">文档</span>
            <span class="pill">运营</span>
          </div>
          <div class="route" aria-hidden="true"></div>
          <div class="decision-dot">判断</div>
          <div class="wrong-label">Wrong direction<br />gets faster</div>
        </div>
        <div class="judgment-ribbon" aria-label="series gates">
          <span>该不该做</span>
          <span>边界</span>
          <span>系统</span>
          <span>护城河</span>
        </div>
      </section>

      <div class="subtitle">做得很快，但方向错了。</div>
    </section>
  </main>
</body>
</html>
