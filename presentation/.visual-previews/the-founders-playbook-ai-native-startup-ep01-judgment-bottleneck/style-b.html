<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Style B - Source Editorial Ledger</title>
  <link rel="stylesheet" href="preview.css" />
</head>
<body class="variant-b">
  <main class="phone" aria-label="Source editorial ledger style preview">
    <section class="stage">
      <div class="topline">
        <div class="badge">EP01 / Source Ledger</div>
        <div class="source">Idea → MVP → Launch → Scale</div>
      </div>

      <header class="headline">
        <div class="kicker">FINAL QUESTION</div>
        <h1>现在缺的是速度，还是判断？</h1>
        <div class="subclaim">不要把 AI 工具当成创业判断本身。</div>
      </header>

      <section class="artifact" aria-label="editorial source logic visual">
        <div class="ledger">
          <aside class="margin-notes" aria-label="source notes">
            <span class="note">execution compression</span>
            <span class="note">founder judgment</span>
          </aside>
          <div class="paper-panel">
            <div class="binary">
              <div class="binary-card">速度</div>
              <div class="binary-card active">判断</div>
            </div>
            <div class="life-strip" aria-label="source lifecycle">
              <span>Idea</span>
              <span>MVP</span>
              <span>Launch</span>
              <span>Scale</span>
            </div>
          </div>
        </div>
      </section>

      <div class="subtitle">现在缺的是速度，还是判断？</div>
    </section>
  </main>
</body>
</html>
